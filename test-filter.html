<!DOCTYPE html>
<html>
<head>
<style>
body { background: #e2e8f0; padding: 50px; font-family: sans-serif; }
.pattern {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(#64748b 2px, transparent 2px), radial-gradient(#64748b 2px, #f8fafc 2px);
  background-size: 40px 40px;
  background-position: 0 0, 20px 20px;
}
.btn-test {
  position: relative;
  z-index: 10;
  padding: 16px 36px;
  border-radius: 9999px;
  font-size: 16px;
  font-weight: bold;
  color: #0f172a;
  background: rgba(255, 255, 255, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.8);
  margin: 20px;
  display: inline-block;
}
.filter-backdrop {
  backdrop-filter: url(#glass-morph) blur(10px);
  -webkit-backdrop-filter: url(#glass-morph) blur(10px);
}
.filter-css {
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
}
</style>
</head>
<body>
<div class="pattern"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="glass-morph" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div class="btn-test filter-backdrop">SVG Backdrop Filter</div>
<div class="btn-test filter-css">CSS Backdrop Blur</div>

</body>
</html>
